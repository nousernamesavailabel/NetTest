<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--LS:HEAD-->
<title>LinkState - Login</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:var(--fn);font-size:13px;min-height:100vh;
     display:grid;place-items:center;padding:20px}
.login{width:100%;max-width:360px;background:var(--surf);border:1px solid var(--bdr);border-radius:6px;overflow:hidden}
.header{padding:16px;border-bottom:1px solid var(--bdr)}
.sub{margin-top:4px;color:var(--mt);font-size:11px}
form{padding:16px;display:flex;flex-direction:column;gap:12px}
label{font-size:11px;color:var(--mt2)}
input{background:var(--bg);border:1px solid var(--bdr2);border-radius:4px;color:var(--tx);
      font-family:var(--fn);font-size:12px;padding:8px 10px;width:100%;outline:none}
input:focus{border-color:var(--cy)}
.field{display:flex;flex-direction:column;gap:5px}
.error{display:none;color:var(--rd);border:1px solid #4d1a1a;background:#2a0a0a;border-radius:4px;padding:8px 10px;font-size:11px}
.error:not(:empty){display:block}
button{display:inline-flex;justify-content:center;align-items:center;padding:8px 14px;border-radius:4px;
       font-size:11px;font-family:var(--fn);cursor:pointer;border:1px solid var(--accent-bdr);
       background:var(--accent-bg);color:var(--cy)}
button:hover{background:var(--accent-bdr)}
.login.has-banner{max-width:520px}
.banner{background:var(--bg);border:1px solid var(--bdr2);border-radius:4px;padding:10px 12px;
        font-size:11px;line-height:1.55;color:var(--tx);white-space:pre-wrap;overflow-wrap:anywhere;
        max-height:40vh;overflow-y:auto}
.ack{display:flex;align-items:flex-start;gap:8px;font-size:11px;color:var(--mt2);cursor:pointer}
.ack input{width:auto;margin-top:2px;accent-color:var(--cy)}
.powered{padding:0 16px 12px;color:var(--mt);font-size:10px;text-align:right}
</style>
</head>
<body>
  <div class="login{{login_class}}">
    <div class="header">
      <!--LS:BRAND-->
      <div class="sub">{{sub}}</div>
    </div>
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="next" value="{{next}}">
      <input type="hidden" name="csrf_token" value="{{csrf_token}}">
      <div class="error">{{error}}</div>
      {{banner}}
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" maxlength="128" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
      </div>
      {{ack}}
      <button type="submit">Log In</button>
    </form>
    {{powered}}
  </div>
</body>
</html>
