# =============================================================
# NetTest Controller — Configuration File
#
# Copy this file to config.yaml and edit before starting.
# config.yaml is never overwritten by install.sh upgrades.
# =============================================================


# ── Controller ─────────────────────────────────────────────
controller:
  # Display name shown in the web dashboard header
  name: "NetTest Controller"

  # Directory for test result files (JSONL, one file per day)
  # Relative to the app working directory (/opt/nettest)
  results_dir: results

  # Directory for log files
  log_dir: logs

  # Log verbosity: DEBUG | INFO | WARNING | ERROR
  log_level: INFO


# ── Authentication ─────────────────────────────────────────
auth:
  # RADIUS server IP or hostname.
  # Leave blank ("") to disable authentication entirely —
  # the dashboard will be accessible without login.
  radius_server: ""

  # RADIUS UDP port (default: 1812)
  radius_port: 1812

  # RADIUS shared secret — must match your RADIUS server config
  radius_secret: ""

  # RADIUS request timeout in seconds
  radius_timeout: 5

  # Secret key for signing Flask session cookies.
  # REQUIRED even if RADIUS is disabled.
  # Generate a strong value with:
  #   python3 -c "import secrets; print(secrets.token_hex(32))"
  session_secret: "replace-with-a-random-secret"

  # How long a login session stays valid (minutes)
  # Default: 480 minutes (8 hours)
  session_lifetime_minutes: 480

  # Brute-force protection: max failed attempts before lockout
  login_max_attempts: 5

  # Time window in which failed attempts are counted (seconds)
  login_window_seconds: 300

  # How long a locked-out IP must wait before trying again (seconds)
  login_lockout_seconds: 900

  # Set to true if the dashboard is behind HTTPS.
  # When true, session cookies are marked Secure and only sent over HTTPS.
  # Leave false for HTTP-only deployments.
  cookie_secure: false


# ── SSH Defaults ────────────────────────────────────────────
# These apply to all agents unless overridden per-agent.
ssh_defaults:
  # Username on agent hosts (created by the agent setup / onboard process)
  username: nettest

  # Password authentication — leave blank to use key-based auth (recommended)
  password: ""

  # Path to the private SSH key on the controller.
  # Generated by install.sh at /opt/nettest/.ssh/nettest_key
  key_file: /opt/nettest/.ssh/nettest_key

  # SSH port on agent hosts
  port: 22

  # SSH connection timeout in seconds
  timeout: 30


# ── Agents ─────────────────────────────────────────────────
# One entry per host the controller can SSH into to run tests.
# Agents are added automatically via the onboard tool, or manually here.
#
# Fields:
#   id     - unique identifier, no spaces (used in path definitions)
#   label  - human-readable display name shown in the dashboard
#   host   - IP address or hostname the controller reaches this agent on
#   type   - endpoint: a branch host, server, or workstation
#            svi_adjacent: a probe host placed adjacent to an SVI for
#                          per-hop measurement at L3 boundaries
#
# Per-agent SSH overrides (optional — falls back to ssh_defaults if omitted):
#   username, password, key_file, port
agents:
  # host_mgmt_ip: the IP the controller SSHes to for control (required)
  # host_test_ip: the IP used as the target for iPerf3/ping test traffic (optional)
  #               If omitted, host_mgmt_ip is used for both control and test traffic.
  #               Set this when your management and client networks are separate.

  - id: hub
    label: "Hub — Data Center"
    host_mgmt_ip: 10.0.1.10     # management network
    host_test_ip: 10.1.1.10     # client/test network
    type: endpoint

  - id: branch_a
    label: "Branch A — Chicago"
    host_mgmt_ip: 10.0.2.10     # management network
    host_test_ip: 10.1.2.10     # client/test network
    type: endpoint

  # Single-network agent (management and test traffic use same IP)
  # - id: branch_b
  #   label: "Branch B — Dallas"
  #   host_mgmt_ip: 10.1.3.10
  #   type: endpoint

  # Example: SVI-adjacent probe for inter-VLAN segment measurement
  # - id: svi_probe_r1
  #   label: "Core Router 1 SVI Probe"
  #   host_mgmt_ip: 10.0.10.50
  #   host_test_ip: 10.1.10.50
  #   type: svi_adjacent


# ── Test Paths ──────────────────────────────────────────────
# Defines which source→destination pairs to test and what tests to run.
# Both source and destination must reference agent IDs defined above.
#
# Available test types:
#   latency           - ICMP ping: RTT avg/min/max, packet loss
#   jitter            - iPerf3 UDP: jitter and packet loss at controlled bandwidth
#   throughput        - iPerf3 TCP: TX/RX Mbps, retransmits (multi-stream)
#   latency_under_load - Ping idle vs ping under iPerf3 saturation (bufferbloat)
#                        Also runs MTR hop trace under load
#   mtu               - Binary search for effective path MTU using DF-bit ping
paths:
  - id: branch_a_to_hub
    label: "Branch A → Hub"
    source: branch_a
    destination: hub
    tests:
      - latency
      - jitter
      - throughput
      - latency_under_load
      - mtu

  # Lightweight latency-only path (good for slow or metered links)
  # - id: branch_a_to_hub_light
  #   label: "Branch A → Hub (light)"
  #   source: branch_a
  #   destination: hub
  #   tests:
  #     - latency
  #     - jitter


# ── Test Parameters ─────────────────────────────────────────
# Fine-tune how each test type behaves.
# These apply globally to all paths.
test_params:

  throughput:
    # How long each iPerf3 test runs (seconds)
    # Longer = more accurate, but slower overall test cycle
    duration_sec: 30

    # Number of parallel TCP streams
    # More streams = more realistic multi-user traffic simulation
    # Recommended: 8 for most networks, reduce for very slow links
    parallel_streams: 8

    # Test upload and download simultaneously
    # Exposes ACK contention on asymmetric links
    bidirectional: true

    # tcp or udp (TCP recommended for throughput measurement)
    protocol: tcp

    # iPerf3 server port on the destination agent
    iperf3_port: 5201

  latency:
    # Number of ICMP packets to send per test
    packet_count: 100

    # Interval between packets (milliseconds)
    # 10ms = 100 packets/second
    interval_ms: 10

    # ICMP payload size in bytes (not including headers)
    packet_size_bytes: 64

  latency_under_load:
    # Ping packets to send during each phase (idle and loaded)
    ping_count: 50

    # Interval between ping packets during load test (milliseconds)
    ping_interval_ms: 200

    # Number of MTR measurement cycles for the hop trace
    mtr_cycles: 20

  jitter:
    # Number of UDP packets to send
    packet_count: 1000

    # Interval between UDP packets (milliseconds)
    interval_ms: 10

    # UDP payload size in bytes
    # 172 bytes = typical VoIP packet size
    packet_size_bytes: 172

    # iPerf3 server port on the destination agent
    iperf3_port: 5201

    protocol: udp

    # Target send bandwidth (Kbps)
    # Controlled bandwidth makes jitter results consistent and comparable
    bandwidth_kbps: 1000

  mtu:
    # Maximum packet size to probe (bytes)
    # 9000 = jumbo frames; safe to leave at 9000 even if jumbo not supported
    max_size: 9000

    # Minimum packet size to probe (bytes)
    min_size: 576

    # Binary search step size (bytes)
    # Smaller = more precise result, more probes required
    step: 10

  traceroute:
    # Maximum number of hops to probe
    max_hops: 30

    # Number of probes per hop (more = better RTT accuracy, slower)
    probes: 2

    # Seconds to wait for each probe response
    # Non-responding hops (* * *) cost this many seconds each
    wait_sec: 1

    # Perform DNS reverse lookup on hop IPs to get hostnames
    # Adds context but slightly slower on paths with many hops
    resolve_dns: true


# ── Schedule ────────────────────────────────────────────────
schedule:
  # How often to run the full test suite across all paths (minutes)
  # Each path runs all its configured tests once per interval
  full_test_interval_minutes: 60

  # How often to run latency and jitter only (minutes)
  # Faster, lower overhead — good for frequent health checks
  latency_only_interval_minutes: 5

  # Restrict full test suite to business hours only
  # Useful if you only want throughput tests during working hours
  # Latency-only tests always run on their own schedule regardless
  business_hours_only: false

  # Business hours window (24-hour format, controller's local time)
  business_hours_start: "08:00"
  business_hours_end:   "18:00"

  # Timezone for business hours evaluation
  # Use IANA timezone names: America/Chicago, America/New_York, UTC, etc.
  timezone: "America/Chicago"

  # Seconds to wait between starting each path test
  # Prevents all paths from generating traffic simultaneously
  # With 8 paths and 15s stagger, all paths start within 2 minutes
  stagger_seconds: 15
